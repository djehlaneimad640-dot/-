<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر الطرشونة</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
  text-align: center;
}

header {
  background: #0a74da;
  color: white;
  padding: 20px;
}

.product {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 10px;
}

.product img {
  width: 220px;
  border-radius: 10px;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
  margin: 5px;
}

.whatsapp {
  background: #25D366;
  color: white;
}

.instagram {
  background: #E1306C;
  color: white;
}

</style>

</head>

<body>

<header>
<h1 id="storeName"></h1>
<p>أفضل جودة للتنظيف</p>
</header>

<div class="product">
<img id="productImage" src="">
<h2 id="productName"></h2>

<p>✔ امتصاص قوي</p>
<p>✔ لا تترك آثار</p>
<p>✔ تدوم طويلاً</p>

<h3 id="productPrice"></h3>

<!-- أزرار الطلب -->
<button class="whatsapp" onclick="orderWhatsApp()">اطلب عبر واتساب</button>
<br>
<button class="instagram" onclick="openInstagram()">زيارة إنستغرام</button>

</div>

<script>

// 🔥 عدل هنا فقط 👇
const DATA = {
  storeName: "متجر الطرشونة",
  productName: "طرشونة احترافية",
  price: "500 دج",
  image: "ضع_رابط_الصورة_هنا",
  phone: "213XXXXXXXXX", // رقمك بدون +
  instagram: "https://instagram.com/yourpage"
};

// لا تغير هذا 👇
document.getElementById("storeName").innerText = DATA.storeName;
document.getElementById("productName").innerText = DATA.productName;
document.getElementById("productPrice").innerText = "السعر: " + DATA.price;
document.getElementById("productImage").src = DATA.image;

// زر واتساب
function orderWhatsApp() {
  let message = `مرحبا، أريد طلب ${DATA.productName} بسعر ${DATA.price}`;
  let url = `https://wa.me/${DATA.phone}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

// زر إنستغرام
function openInstagram() {
  window.open(DATA.instagram, '_blank');
}

</script>

</body>
</html>
