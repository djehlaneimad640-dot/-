<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الطرشونات الأنيقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #d97706; /* لون عسلي دافئ ومريح للأدوات المنزلية */
            --bg-color: #f8fafc;    /* خلفية بيضاء مائلة للرمادي الفاتح جداً */
            --card-bg: #ffffff;     /* لون البطاقات أبيض نقي */
            --text-color: #1f2937;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .store-container {
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            color: var(--primary-color);
            margin: 0;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* ظل ناعم */
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 350px;
            object-fit: cover; /* لكي تناسب الصورة الإطار بشكل جميل */
            border-bottom: 2px solid var(--primary-color);
        }

        .product-info {
            padding: 20px;
            text-align: center;
        }

        .product-name {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            color: #111827;
        }

        .price-tag {
            font-size: 30px;
            color: #059669; /* أخضر مريح */
            font-weight: 700;
            margin: 15px 0;
        }

        .buy-button {
            display: block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            transition: background 0.3s;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .buy-button:hover {
            background-color: #b45309;
        }

        .footer-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="store-container">
    <div class="header">
        <h1 id="storeName">اسم متجر الطرشونات</h1>
    </div>

    <div class="product-card">
        <img id="productImage" src="https://via.placeholder.com/400x400.png?text=جاري+تحميل+الصورة" alt="طرشون" class="product-image">
        <div class="product-info">
            <div class="product-name" id="productName">طقم طرشونات قطنية</div>
            <div class="price-tag" id="priceLabel">00 د.ج</div>
            
            <a href="#" id="whatsappBtn" class="buy-button">طلب عبر واتساب الآن</a>
        </div>
    </div>

    <div class="footer-links">
        <a href="#" id="instagramLink" class="social-icon">انستغرام</a>
    </div>
</div>

<script>
    // --- قم بتعديل بياناتك هنا فقط ---
    const DATA = {
        storeName: "متجر طرشونات المنزل الأنيق", // اسم متجرك الجديد
        productName: "طقم طرشونات مطبخ قطنية فاخرة", // اسم المنتج
        price: "1500 د.ج", // السعر
        image: "رابط_صورة_الطرشونات_التي_سترسلها_لي", 
        phone: "213XXXXXXXXX", // رقمك بدون +
        instagram: "https://instagram.com/your_page"
    };
    // --------------------------------

    // تحديث الصفحة بالبيانات
    document.getElementById('storeName').innerText = DATA.storeName;
    document.getElementById('productName').innerText = DATA.productName;
    document.getElementById('priceLabel').innerText = DATA.price;
    document.getElementById('productImage').src = DATA.image;
    document.getElementById('instagramLink').href = DATA.instagram;
    
    // رسالة واتساب مخصصة للطرشونات
    const message = `مرحباً ${DATA.storeName}، أريد طلب: ${DATA.productName} بسعر ${DATA.price}`;
    document.getElementById('whatsappBtn').href = `https://wa.me/${DATA.phone}?text=${encodeURIComponent(message)}`;
</script>

</body>
</html>
